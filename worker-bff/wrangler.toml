name = "kirameku-bff"
account_id = "d4add8ad549536a77a5b9fcf6d5be733"
main = "src/index.ts"
compatibility_date = "2026-09-09"
compatibility_flags = ["nodejs_compat"]

# 过渡期：中间层独立子域，回源仍走现有隧道后端（不动 NAS 源站）
routes = [{ pattern = "bff.neutronstar.fun", custom_domain = true }]

[vars]
# 源站 FastAPI（经 CF Tunnel 回 NAS）。T10 切根域后改用 origin.neutronstar.fun
BACKEND_ORIGIN = "https://kirameku-api.neutronstar.fun"
# GET 请求默认缓存策略（上游未给 Cache-Control 时使用）
DEFAULT_SMAXAGE = "60"
DEFAULT_SWR = "300"
# 允许中间层直接代理的路径前缀
PROXY_PREFIXES = "/api,/uploads,/reader3"

[[kv_namespaces]]
binding = "CACHE_TAGS"
id = "4959a742fe4d44dbbc0ba8c200bea694"

# ---------------------------------------------------------------------------
# P4 实时：SSE 扇出房间（一个频道一个 Durable Object 实例）
# 免费计划必须用 SQLite 存储后端（new_sqlite_classes），KV 后端 DO 要付费计划。
# 迁移 tag 一旦上线不可改，后续新增 class 只能追加新的 [[migrations]] 块。
# ---------------------------------------------------------------------------
[[durable_objects.bindings]]
name = "REALTIME_ROOM"
class_name = "RealtimeRoom"

[[migrations]]
tag = "v1-add-realtime-room"
new_sqlite_classes = ["RealtimeRoom"]

[observability]
enabled = true
